<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Padel Americano</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- ==========================================
             SETUP
             ========================================== -->

        <section id="setupScreen">

            <header>
                <h1>Padel Americano</h1>

                <p class="subtitle">
                    7 spillere · 1 doublebane · 1 singlebane
                </p>
            </header>


            <div class="card">

                <h2>Spillere</h2>

                <div class="player-input">
                    <span>1.</span>
                    <input type="text" id="player1" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>2.</span>
                    <input type="text" id="player2" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>3.</span>
                    <input type="text" id="player3" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>4.</span>
                    <input type="text" id="player4" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>5.</span>
                    <input type="text" id="player5" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>6.</span>
                    <input type="text" id="player6" placeholder="Navn">
                </div>

                <div class="player-input">
                    <span>7.</span>
                    <input type="text" id="player7" placeholder="Navn">
                </div>


                <button
                    class="primary-button"
                    onclick="startTournament()"
                >
                    START TURNERING
                </button>

            </div>

        </section>


        <!-- ==========================================
             TOURNAMENT
             ========================================== -->

        <section
            id="tournamentScreen"
            class="hidden"
        >

            <header class="tournament-header">

                <div>

                    <p class="round-label">
                        RUNDE
                    </p>

                    <h1 id="roundNumber">
                        1
                    </h1>

                </div>

                <button
                    class="secondary-button"
                    onclick="showSetupScreen()"
                >
                    NY TURNERING
                </button>

            </header>


            <!-- ======================================
                 DOUBLE
                 ====================================== -->

            <div class="match-card">

                <div class="match-header">

                    <div>
                        <span class="match-type">
                            DOUBLE
                        </span>

                        <span class="points-label">
                            32 POINT
                        </span>
                    </div>

                </div>


                <div class="match">

                    <div
                        class="team"
                        id="doubleTeam1"
                    >
                        -
                    </div>


                    <div class="score-input">

                        <input
                            type="number"
                            id="doubleScore1"
                            min="0"
                            max="32"
                            placeholder="0"
                        >

                        <span>–</span>

                        <input
                            type="number"
                            id="doubleScore2"
                            min="0"
                            max="32"
                            placeholder="0"
                        >

                    </div>


                    <div
                        class="team"
                        id="doubleTeam2"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- ======================================
                 SINGLE
                 ====================================== -->

            <div class="match-card">

                <div class="match-header">

                    <div>
                        <span class="match-type">
                            SINGLE
                        </span>

                        <span class="points-label">
                            32 POINT
                        </span>
                    </div>

                </div>


                <div class="match">

                    <div
                        class="team"
                        id="singlePlayer1"
                    >
                        -
                    </div>


                    <div class="score-input">

                        <input
                            type="number"
                            id="singleScore1"
                            min="0"
                            max="32"
                            placeholder="0"
                        >

                        <span>–</span>

                        <input
                            type="number"
                            id="singleScore2"
                            min="0"
                            max="32"
                            placeholder="0"
                        >

                    </div>


                    <div
                        class="team"
                        id="singlePlayer2"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- ======================================
                 REST
                 ====================================== -->

            <div class="rest-card">

                <span class="rest-icon">
                    ☕
                </span>

                <div>

                    <span class="rest-label">
                        PAUSE
                    </span>

                    <strong id="restPlayer">
                        -
                    </strong>

                </div>

            </div>


            <!-- ======================================
                 SAVE ROUND
                 ====================================== -->

            <button
                class="primary-button next-button"
                onclick="submitRound()"
            >
                GEM RUNDE
            </button>


            <!-- ======================================
                 LEADERBOARD
                 ====================================== -->

            <div
                id="leaderboard"
                class="leaderboard"
            >

                <div class="leaderboard-header">

                    <div>
                        <span class="section-label">
                            TURNERING
                        </span>

                        <h2>
                            Stillingen
                        </h2>
                    </div>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Spiller</th>

                                <th>Point</th>

                                <th>D</th>

                                <th>S</th>

                                <th>P</th>

                            </tr>

                        </thead>


                        <tbody id="leaderboardList">
                        </tbody>

                    </table>

                </div>


                <div class="legend">

                    <span>
                        <strong>D</strong>
                        Double
                    </span>

                    <span>
                        <strong>S</strong>
                        Single
                    </span>

                    <span>
                        <strong>P</strong>
                        Pause
                    </span>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
